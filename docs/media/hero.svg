<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="rbox - minimal screen recorder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0b0b0d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="400" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>

  <!-- Everything outside the selection is dimmed, the way the real overlay does it. -->
  <g clip-path="url(#card)" fill="#000000" fill-opacity="0.55">
    <rect x="0" y="0" width="1200" height="90"/>
    <rect x="0" y="310" width="1200" height="90"/>
    <rect x="0" y="90" width="300" height="220"/>
    <rect x="900" y="90" width="300" height="220"/>
  </g>

  <!-- The selection, drawn around the mark and the wordmark. -->
  <rect x="300" y="90" width="600" height="220" fill="none"
        stroke="#ef4444" stroke-width="3" stroke-dasharray="10 8"/>
  <g fill="#ef4444">
    <rect x="294" y="84" width="12" height="12" rx="2"/>
    <rect x="894" y="84" width="12" height="12" rx="2"/>
    <rect x="294" y="304" width="12" height="12" rx="2"/>
    <rect x="894" y="304" width="12" height="12" rx="2"/>
  </g>

  <!-- app mark -->
  <g transform="translate(398 132) scale(0.26)">
    <rect fill="#212121" width="512" height="512" rx="112" ry="112"/>
    <circle fill="#ef4444" cx="334" cy="262" r="58"/>
    <path fill="#fff" d="M120,364v-216h56v38h2.4c4-13.4,10.6-23.5,19.9-30.4,9.3-6.8,20-10.2,32-10.2s6.2.2,9.6.5c3.5.3,6.5.8,9,1.5v51.8c-2.6-.9-6.3-1.6-11.2-2.1-4.9-.5-9.5-.8-13.9-.8-8.7,0-16.6,1.9-23.7,5.7-7.1,3.8-12.5,9.1-16.5,15.9-3.9,6.8-5.9,14.7-5.9,23.7v122.5h-58Z"/>
  </g>

  <g font-family="Segoe UI,Inter,Helvetica Neue,Arial,sans-serif">
    <text x="565" y="196" font-size="74" font-weight="700" fill="#fafafa" letter-spacing="-2">rbox</text>
    <text x="567" y="234" font-size="22" fill="#a1a1aa">Minimal screen recorder</text>
    <text x="567" y="268" font-size="16" fill="#71717a">MP4 &#183; GIF &#183; PNG</text>
  </g>

  <!-- Size readout, kept outside the frame so it never covers the region. -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#a1a1aa">
    <text x="300" y="340">1920 &#215; 1080</text>
    <text x="900" y="340" text-anchor="end">30 fps</text>
  </g>
</svg>
